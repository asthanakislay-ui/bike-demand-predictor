[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bike_demand_predictor"
version = "0.0.1"
description = "Bike rental demand prediction using PyTorch ANN"
authors = [
  { name = "Kislay Asthana" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "seaborn",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
    "torch"
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["bike_demand_predictor"]
include = ["pyproject.toml", "bike_demand_predictor/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["bike_demand_predictor"]
force-sort-within-sections = true

